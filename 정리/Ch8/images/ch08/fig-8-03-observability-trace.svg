<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef5ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf5ff"/><stop offset="1" stop-color="#f3e8ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effdf4"/><stop offset="1" stop-color="#dcfce7"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7c3aed"/></marker>
    <style>text{font-family:Arial,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#111827}.title{font-size:48px;font-weight:700}.sub{font-size:24px;fill:#4b5563}.h{font-size:28px;font-weight:700}.b{font-size:21px;font-weight:700}.s{font-size:18px;fill:#586174}.tiny{font-size:16px;fill:#586174}.cap{font-size:20px;fill:#586174}.box{stroke-width:2.5}.line{fill:none;stroke:#7c3aed;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1672" height="941" fill="#fff"/>
  <text x="836" y="70" text-anchor="middle" class="title">메트릭 · 로그 · 트레이스를 한곳에서 읽기</text>
  <text x="836" y="112" text-anchor="middle" class="sub">Grafana에서 이상 징후를 찾고 TraceID로 느린 구간까지 좁힌다</text>

  <rect class="box" x="78" y="205" width="300" height="138" rx="20" fill="url(#blue)" stroke="#2563eb"/>
  <text x="228" y="258" text-anchor="middle" class="h">Prometheus</text>
  <text x="228" y="301" text-anchor="middle" class="b">무엇이 이상한가</text>
  <rect class="box" x="78" y="397" width="300" height="138" rx="20" fill="url(#green)" stroke="#16a34a"/>
  <text x="228" y="450" text-anchor="middle" class="h">Loki</text>
  <text x="228" y="493" text-anchor="middle" class="b">어떤 오류인가</text>
  <rect class="box" x="78" y="589" width="300" height="138" rx="20" fill="url(#purple)" stroke="#7c3aed"/>
  <text x="228" y="642" text-anchor="middle" class="h">Tempo</text>
  <text x="228" y="685" text-anchor="middle" class="b">어느 구간인가</text>

  <rect class="box" x="478" y="205" width="330" height="522" rx="24" fill="#fcfcfd" stroke="#64748b"/>
  <text x="643" y="267" text-anchor="middle" class="h">Grafana Explore</text>
  <text x="643" y="322" text-anchor="middle" class="b">오류율 상승 확인</text>
  <text x="643" y="365" text-anchor="middle" class="s">같은 시간대 로그 조회</text>
  <text x="643" y="408" text-anchor="middle" class="s">TraceID 선택</text>
  <text x="643" y="451" text-anchor="middle" class="s">Span 시간 비교</text>
  <line x1="538" y1="489" x2="748" y2="489" stroke="#cbd5e1" stroke-width="2"/>
  <text x="643" y="540" text-anchor="middle" class="b">하나의 조사 흐름</text>
  <text x="643" y="584" text-anchor="middle" class="s">숫자 → 오류 → 경로</text>
  <text x="643" y="629" text-anchor="middle" class="s">Backend 교체는 Endpoint로</text>
  <path class="line" d="M378 274H466"/><path class="line" d="M378 466H466"/><path class="line" d="M378 658H466"/>

  <rect class="box" x="906" y="205" width="678" height="522" rx="24" fill="#fbf9ff" stroke="#7c3aed"/>
  <text x="1245" y="261" text-anchor="middle" class="h">Trace: /id 요청 전체 55ms</text>
  <line x1="1008" y1="315" x2="1492" y2="315" stroke="#d1d5db" stroke-width="5"/>
  <text x="978" y="321" text-anchor="end" class="s">handle-id</text>
  <rect x="1008" y="301" width="484" height="28" rx="7" fill="#7c3aed"/>
  <text x="1510" y="321" class="tiny">55ms</text>
  <text x="978" y="394" text-anchor="end" class="s">valkey-incr</text>
  <rect x="1052" y="374" width="70" height="28" rx="7" fill="#2563eb"/>
  <text x="1140" y="394" class="tiny">3ms</text>
  <text x="978" y="467" text-anchor="end" class="s">kafka-produce</text>
  <rect x="1122" y="447" width="210" height="28" rx="7" fill="#d97706"/>
  <text x="1350" y="467" class="tiny">12ms</text>
  <text x="978" y="540" text-anchor="end" class="s">http-response</text>
  <rect x="1332" y="520" width="52" height="28" rx="7" fill="#16a34a"/>
  <text x="1402" y="540" class="tiny">1ms</text>
  <line x1="1008" y1="592" x2="1492" y2="592" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1245" y="638" text-anchor="middle" class="b">Span은 책임 경계에 배치</text>
  <text x="1245" y="679" text-anchor="middle" class="s">HTTP Handler · Valkey · Kafka · Consumer</text>

  <line x1="45" y1="827" x2="1627" y2="827" stroke="#94a3b8" stroke-width="2"/>
  <text x="836" y="877" text-anchor="middle" class="cap">그림 8-3. 세 관측 신호를 연결하면 오류 발생 시점에서 느린 Span까지 조사 범위를 좁힐 수 있다.</text>
</svg>
