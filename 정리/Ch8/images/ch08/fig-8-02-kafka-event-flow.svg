  <rect x="68" y="462" width="1536" height="314" rx="24" fill="#f8fdf9" stroke="#86efac" stroke-width="2.5"/>
  <text x="112" y="512" class="h" fill="#15803d">변경 · 비동기 처리</text>
  <rect class="box" x="118" y="570" width="210" height="96" rx="16" fill="#fff" stroke="#16a34a"/>
