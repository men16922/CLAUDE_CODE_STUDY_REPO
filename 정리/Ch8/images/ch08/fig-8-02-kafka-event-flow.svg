  <text x="1435" y="641" text-anchor="middle" class="s">HTTP</text>
  <text x="853" y="735" text-anchor="middle" class="s">Consumer가 멈춰도 메시지를 보관하고 마지막 Commit 이후부터 다시 처리</text>

  <line x1="45" y1="827" x2="1627" y2="827" stroke="#94a3b8" stroke-width="2"/>
  <text x="836" y="877" text-anchor="middle" class="cap">그림 8-2. Kafka가 요청 수신과 실제 알림 처리 사이의 시간과 확장 경계를 분리한다.</text>
