    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffbeb"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#dc2626"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#16a34a"/></marker>
    <style>text{font-family:Arial,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#111827}.title{font-size:48px;font-weight:700}.sub{font-size:24px;fill:#4b5563}.h{font-size:29px;font-weight:700}.b{font-size:21px;font-weight:700}.s{font-size:18px;fill:#586174}.cap{font-size:20px;fill:#586174}.box{stroke-width:2.5}.redline{fill:none;stroke:#dc2626;stroke-width:4;marker-end:url(#arrowRed)}.greenline{fill:none;stroke:#16a34a;stroke-width:4;marker-end:url(#arrowGreen)}</style>
  </defs>
  <rect width="1672" height="941" fill="#fff"/>
  <text x="836" y="70" text-anchor="middle" class="title">동기 처리에서 이벤트 드리븐 처리로</text>
  <text x="836" y="112" text-anchor="middle" class="sub">API의 책임을 요청 수신과 이벤트 기록으로 줄이고 실제 처리는 Consumer가 맡는다</text>

