  <text x="853" y="637" text-anchor="middle" class="b">Partition × 3</text>
  <text x="853" y="668" text-anchor="middle" class="s">디스크 저장 · Offset</text>
  <rect class="box" x="1080" y="570" width="240" height="96" rx="16" fill="url(#green)" stroke="#16a34a"/>
